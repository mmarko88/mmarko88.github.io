{{- /* Newsletter subscribe form — renders only when site.Params.buttondown is set,
     otherwise falls back to an RSS link. */ -}}
{{- with site.Params.buttondown }}
<form action="https://buttondown.com/api/emails/embed-subscribe/{{ . }}" method="post"
      target="popupwindow" onsubmit="window.open('https://buttondown.com/{{ . }}', 'popupwindow')"
      class="post_cta_form">
  <label for="bd-email">Subscribe for new posts:</label>
  <input type="email" name="email" id="bd-email" placeholder="you@example.com" required />
  <input type="submit" value="Subscribe" />
</form>
{{- else }}
<p>Or <a href="{{ "index.xml" | relURL }}">subscribe via RSS</a> to get new posts.</p>
{{- end }}
