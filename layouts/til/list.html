{{ define "main" }}
<div class="home_centered wrap content">
  <div>
    <h1 class="post_title">{{ .Title }}</h1>
    {{- with .Content }}{{ . }}{{ end }}
    <ul class="posts til_stream">
      {{- range .RegularPages.ByDate.Reverse }}
      <li class="til_item">
        <h2 class="til_title">
          <a href="{{ .Permalink }}" title="{{ .Title }}">{{ .Title | markdownify }}</a>
        </h2>
        {{ partial "post-meta" . }}
        <div class="post_body">
          {{ .Content }}
        </div>
      </li>
      {{- end }}
    </ul>
    <a class="back_to_top" href="#" aria-label="Back to top">↑</a>
    <script>
      (function () {
        var btn = document.querySelector('.back_to_top');
        window.addEventListener('scroll', function () {
          btn.classList.toggle('is-visible', window.scrollY > 600);
        }, { passive: true });
        btn.addEventListener('click', function (e) {
          e.preventDefault();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      })();
    </script>
  </div>
</div>
{{ end }}
