{{ define "main" }}
<div class="grid-inverse wrap content">
  <div>
    <h1 class="post_title">{{ .Title }}</h1>
    {{- with .Content }}{{ . }}{{ end }}
    <ul class="posts til_stream">
      {{- range .RegularPages.ByDate.Reverse }}
      <li class="til_item">
        <h2 class="til_title">
          <a href="{{ .Permalink }}" title="{{ .Title }}">{{ .Title | markdownify }}</a>
        </h2>
        {{ partial "post-meta" . }}
        <div class="post_body">
          {{ .Content }}
        </div>
      </li>
      {{- end }}
    </ul>
  </div>
  {{- partial "sidebar" . }}
</div>
{{ end }}
