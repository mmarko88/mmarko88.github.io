  <text x="72" y="76" fill="#1a5fb4" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2">AGENTIC DEVELOPMENT · 10/10</text>
  <text x="72" y="150" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700">Six-month retrospective</text>
  <text x="72" y="194" fill="#4b5565" font-family="Segoe UI, Arial, sans-serif" font-size="22">What stuck, what I killed, the actual ROI numbers from a team of three</text>
  
  <text x="72" y="266" fill="#17864b" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Kept (9 patterns)</text>
  <text x="72" y="298" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="18">Different critic · context budget · rule layering · eval harness · 2-retry</text>
  <text x="72" y="326" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="18">Specialists · read-only subagents · one-topic · in-turn compliance</text>
