<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" data-theme-palette=""><!-- cascade:theme-palette --><style>@media (prefers-color-scheme: dark){[data-theme-palette] text[fill="#172033"],[data-theme-palette] tspan[fill="#172033"]{fill:#ffffff}[data-theme-palette] text[fill="#4b5565"],[data-theme-palette] tspan[fill="#4b5565"]{fill:#9aa8bf}[data-theme-palette] text[fill="#617086"],[data-theme-palette] tspan[fill="#617086"]{fill:#9aa8bf}[data-theme-palette] rect[fill="#f7f9fc"],[data-theme-palette] circle[fill="#f7f9fc"],[data-theme-palette] ellipse[fill="#f7f9fc"],[data-theme-palette] path[fill="#f7f9fc"],[data-theme-palette] polygon[fill="#f7f9fc"],[data-theme-palette] polyline[fill="#f7f9fc"],[data-theme-palette] line[fill="#f7f9fc"]{fill:#172033}[data-theme-palette] rect[fill="#172033"],[data-theme-palette] circle[fill="#172033"],[data-theme-palette] ellipse[fill="#172033"],[data-theme-palette] path[fill="#172033"],[data-theme-palette] polygon[fill="#172033"],[data-theme-palette] polyline[fill="#172033"],[data-theme-palette] line[fill="#172033"]{fill:#24304d}[data-theme-palette] rect[fill="#4b5565"],[data-theme-palette] circle[fill="#4b5565"],[data-theme-palette] ellipse[fill="#4b5565"],[data-theme-palette] path[fill="#4b5565"],[data-theme-palette] polygon[fill="#4b5565"],[data-theme-palette] polyline[fill="#4b5565"],[data-theme-palette] line[fill="#4b5565"]{fill:#55667f}[data-theme-palette] rect[fill="#617086"],[data-theme-palette] circle[fill="#617086"],[data-theme-palette] ellipse[fill="#617086"],[data-theme-palette] path[fill="#617086"],[data-theme-palette] polygon[fill="#617086"],[data-theme-palette] polyline[fill="#617086"],[data-theme-palette] line[fill="#617086"]{fill:#7d8699}}</style>
  <rect width="1200" height="630" fill="#f7f9fc"/>
  <rect x="0" y="0" width="1200" height="12" fill="#1a5fb4"/>
  <text x="72" y="76" fill="#1a5fb4" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2">AGENTIC DEVELOPMENT · SECURITY</text>
  <text x="72" y="150" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700">Agent security and trust boundaries</text>
  <text x="72" y="194" fill="#4b5565" font-family="Segoe UI, Arial, sans-serif" font-size="22">What to never let a coding agent do — the trust model for production codebases</text>

  <text x="72" y="270" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">The three zones</text>

  <rect x="72" y="295" width="320" height="110" rx="14" fill="#dcfce7" stroke="#17864b" stroke-width="2"/>
  <text x="232" y="338" text-anchor="middle" fill="#17864b" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">GREEN</text>
  <text x="232" y="365" text-anchor="middle" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="16">Read · Search · Edit</text>
  <text x="232" y="390" text-anchor="middle" fill="#4b5565" font-family="Segoe UI, Arial, sans-serif" font-size="14">Autonomous — safe, reversible</text>

  <rect x="420" y="295" width="320" height="110" rx="14" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
  <text x="580" y="338" text-anchor="middle" fill="#a16207" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">YELLOW</text>
  <text x="580" y="365" text-anchor="middle" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="16">Shell · Commit · Build</text>
  <text x="580" y="390" text-anchor="middle" fill="#4b5565" font-family="Segoe UI, Arial, sans-serif" font-size="14">Supervised — side effects</text>

  <rect x="768" y="295" width="360" height="110" rx="14" fill="#fce4e4" stroke="#dc2626" stroke-width="2"/>
  <text x="948" y="338" text-anchor="middle" fill="#dc2626" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">RED</text>
  <text x="948" y="365" text-anchor="middle" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="16">Push · Deploy · Delete · Send</text>
  <text x="948" y="390" text-anchor="middle" fill="#4b5565" font-family="Segoe UI, Arial, sans-serif" font-size="14">Gated — explicit human confirmation</text>

  <text x="72" y="460" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Six rules</text>
  <text x="72" y="492" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="17">1. Secrets never in commands  2. No destructive ops without ask  3. Read-only for investigation</text>
  <text x="72" y="520" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="17">4. Minimum credential scope  5. Review every diff  6. Separate implementer from reviewer</text>

  <text x="72" y="604" fill="#617086" font-family="Segoe UI, Arial, sans-serif" font-size="18">Minimum access, maximum oversight — the agent is a contractor, not a trusted employee</text>
</svg>
