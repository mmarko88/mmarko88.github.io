  <text x="72" y="454" fill="#4b5565" font-family="Segoe UI, Arial, sans-serif" font-size="18">pip variations are the same approach to the planner · context fills with errors · loss aversion</text>
  <text x="72" y="492" fill="#4b5565" font-family="Segoe UI, Arial, sans-serif" font-size="18">Attempt 1: obvious fix · Attempt 2: a different approach · then report and ask</text>
  
