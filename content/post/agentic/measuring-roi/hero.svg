  <text x="410" y="454" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Negative ROI</text>

  <rect x="820" y="380" width="300" height="120" rx="14" fill="#173f6d"/>
  <text x="970" y="420" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Total cost equation</text>
  <text x="970" y="450" text-anchor="middle" fill="#cce6ff" font-family="Segoe UI, Arial, sans-serif" font-size="14">dev_time + tokens</text>
  <text x="970" y="475" text-anchor="middle" fill="#cce6ff" font-family="Segoe UI, Arial, sans-serif" font-size="14">+ review + rework</text>

  <text x="72" y="604" fill="#617086" font-family="Segoe UI, Arial, sans-serif" font-size="18">Measure all four costs or you're fooling yourself — tracked data from six months of real use</text>
