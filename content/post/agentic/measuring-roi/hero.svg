  <text x="460" y="409" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">0-20% saved</text>

  <text x="310" y="455" text-anchor="end" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="18">Architecture decisions</text>
