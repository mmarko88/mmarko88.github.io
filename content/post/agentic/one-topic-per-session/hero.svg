  <text x="980" y="345" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">1.8 completed / session</text>
  <text x="72" y="420" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">What context-switching costs</text>
  <text x="72" y="454" fill="#4b5565" font-family="Segoe UI, Arial, sans-serif" font-size="18">context dilution  ·  cross-contamination  ·  no completion signal</text>
  <text x="72" y="492" fill="#4b5565" font-family="Segoe UI, Arial, sans-serif" font-size="18">Finish the current thread, or explicitly close it, before opening the next</text>
  
  <rect x="950" y="240" width="180" height="100" rx="16" fill="#173f6d"/>
  <text x="1040" y="284" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">-39%</text>
  <text x="1040" y="312" text-anchor="middle" fill="#cce6ff" font-family="Segoe UI, Arial, sans-serif" font-size="16">session cost</text>
  <text x="72" y="604" fill="#617086" font-family="Segoe UI, Arial, sans-serif" font-size="18">Agents · discipline · context · completion rate</text>
