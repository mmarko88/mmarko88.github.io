  <text x="72" y="150" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700">The concepts that actually matter</text>
  <text x="72" y="194" fill="#4b5565" font-family="Segoe UI, Arial, sans-serif" font-size="22">Five ideas you need before your first coding agent session</text>

  <rect x="72" y="240" width="200" height="100" rx="14" fill="#173f6d"/>
  <text x="172" y="282" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Context Window</text>
