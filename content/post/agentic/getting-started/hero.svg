  <rect x="292" y="240" width="200" height="100" rx="14" fill="#173f6d"/>
  <text x="392" y="282" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Tools</text>
  <text x="392" y="310" text-anchor="middle" fill="#cce6ff" font-family="Segoe UI, Arial, sans-serif" font-size="14">Read, edit, search, run</text>

  <rect x="512" y="240" width="200" height="100" rx="14" fill="#173f6d"/>
  <text x="612" y="282" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Prompts &amp; Rules</text>
  <text x="612" y="310" text-anchor="middle" fill="#cce6ff" font-family="Segoe UI, Arial, sans-serif" font-size="14">Your instructions</text>

  <rect x="732" y="240" width="200" height="100" rx="14" fill="#173f6d"/>
  <text x="832" y="282" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Feedback Loop</text>
  <text x="832" y="310" text-anchor="middle" fill="#cce6ff" font-family="Segoe UI, Arial, sans-serif" font-size="14">Test → fail → fix → pass</text>

  <rect x="952" y="240" width="200" height="100" rx="14" fill="#173f6d"/>
  <text x="1052" y="282" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Verification</text>
