<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="t d" data-theme-palette=""><!-- cascade:theme-palette --><style>@media (prefers-color-scheme: dark){[data-theme-palette] text[fill="#172033"],[data-theme-palette] tspan[fill="#172033"]{fill:#ffffff}[data-theme-palette] text[fill="#4b5565"],[data-theme-palette] tspan[fill="#4b5565"]{fill:#9aa8bf}[data-theme-palette] text[fill="#617086"],[data-theme-palette] tspan[fill="#617086"]{fill:#9aa8bf}[data-theme-palette] rect[fill="#f7f9fc"],[data-theme-palette] circle[fill="#f7f9fc"],[data-theme-palette] ellipse[fill="#f7f9fc"],[data-theme-palette] path[fill="#f7f9fc"],[data-theme-palette] polygon[fill="#f7f9fc"],[data-theme-palette] polyline[fill="#f7f9fc"],[data-theme-palette] line[fill="#f7f9fc"]{fill:#172033}[data-theme-palette] rect[fill="#fff"],[data-theme-palette] circle[fill="#fff"],[data-theme-palette] ellipse[fill="#fff"],[data-theme-palette] path[fill="#fff"],[data-theme-palette] polygon[fill="#fff"],[data-theme-palette] polyline[fill="#fff"],[data-theme-palette] line[fill="#fff"]{fill:#222e45}[data-theme-palette] rect[fill="#eaf1fb"],[data-theme-palette] circle[fill="#eaf1fb"],[data-theme-palette] ellipse[fill="#eaf1fb"],[data-theme-palette] path[fill="#eaf1fb"],[data-theme-palette] polygon[fill="#eaf1fb"],[data-theme-palette] polyline[fill="#eaf1fb"],[data-theme-palette] line[fill="#eaf1fb"]{fill:#22304d}[data-theme-palette] rect[fill="#172033"],[data-theme-palette] circle[fill="#172033"],[data-theme-palette] ellipse[fill="#172033"],[data-theme-palette] path[fill="#172033"],[data-theme-palette] polygon[fill="#172033"],[data-theme-palette] polyline[fill="#172033"],[data-theme-palette] line[fill="#172033"]{fill:#24304d}[data-theme-palette] rect[fill="#4b5565"],[data-theme-palette] circle[fill="#4b5565"],[data-theme-palette] ellipse[fill="#4b5565"],[data-theme-palette] path[fill="#4b5565"],[data-theme-palette] polygon[fill="#4b5565"],[data-theme-palette] polyline[fill="#4b5565"],[data-theme-palette] line[fill="#4b5565"]{fill:#55667f}[data-theme-palette] rect[fill="#617086"],[data-theme-palette] circle[fill="#617086"],[data-theme-palette] ellipse[fill="#617086"],[data-theme-palette] path[fill="#617086"],[data-theme-palette] polygon[fill="#617086"],[data-theme-palette] polyline[fill="#617086"],[data-theme-palette] line[fill="#617086"]{fill:#7d8699}[data-theme-palette] [stroke="#4b5565"]{stroke:#7d8699}}</style>
  <title id="t">Critic gate flow</title>
  <desc id="d">A stage writes an artifact and hands it off to a critic running in a separate context. The critic returns a verdict: accept advances to the next stage; rework loops back to the stage that wrote the artifact.</desc>
  <rect width="960" height="320" fill="#f7f9fc"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4b5565"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/></marker>
  </defs>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="24" y="96" width="180" height="72" rx="14" fill="#eaf1fb" stroke="#1a5fb4" stroke-width="2"/>
    <text x="114" y="128" text-anchor="middle" fill="#172033" font-size="19" font-weight="700">Stage writes</text>
    <text x="114" y="152" text-anchor="middle" fill="#172033" font-size="19" font-weight="700">artifact</text>

    <line x1="204" y1="132" x2="268" y2="132" stroke="#4b5565" stroke-width="2.5" marker-end="url(#arr)"/>
    <text x="236" y="120" text-anchor="middle" fill="#617086" font-size="14">handoff</text>

    <rect x="272" y="84" width="200" height="96" rx="14" fill="#fff" stroke="#173f6d" stroke-width="2"/>
    <text x="372" y="124" text-anchor="middle" fill="#172033" font-size="19" font-weight="700">Critic</text>
    <text x="372" y="150" text-anchor="middle" fill="#617086" font-size="15">fresh, separate context</text>

    <line x1="472" y1="132" x2="536" y2="132" stroke="#4b5565" stroke-width="2.5" marker-end="url(#arr)"/>

    <rect x="540" y="96" width="150" height="72" rx="14" fill="#fff" stroke="#4b5565" stroke-width="2"/>
    <text x="615" y="138" text-anchor="middle" fill="#172033" font-size="19" font-weight="700">Verdict</text>

    <line x1="690" y1="118" x2="760" y2="92" stroke="#17864b" stroke-width="2.5" marker-end="url(#arr)"/>
    <text x="724" y="84" text-anchor="middle" fill="#17864b" font-size="14" font-weight="700">accept</text>
    <rect x="764" y="56" width="172" height="64" rx="14" fill="#d9f2e4" stroke="#17864b" stroke-width="2"/>
    <text x="850" y="94" text-anchor="middle" fill="#172033" font-size="19" font-weight="700">Next stage</text>

    <path d="M615,168 L615,250 L114,250 L114,168" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrR)"/>
    <text x="364" y="272" text-anchor="middle" fill="#c0392b" font-size="14" font-weight="700">rework → back to the stage that wrote it</text>
  </g>
</svg>
