  <rect width="1200" height="630" fill="#f7f9fc"/>
  <rect x="0" y="0" width="1200" height="12" fill="#1a5fb4"/>
  <text x="72" y="76" fill="#1a5fb4" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2">AGENTIC DEVELOPMENT · 03/10</text>
  <text x="72" y="150" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700">Rule layering: user > project > framework</text>
  <text x="72" y="194" fill="#4b5565" font-family="Segoe UI, Arial, sans-serif" font-size="22">Three sources of rules will conflict — without an explicit precedence, agents cherry-pick</text>
  
  <rect x="72" y="246" width="900" height="60" rx="10" fill="#2a7ad4"/>
  <text x="92" y="282" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Layer 1 — User global</text>
  <text x="950" y="282" text-anchor="end" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="18">overrides everything below</text>
  <rect x="72" y="316" width="900" height="60" rx="10" fill="#1a5fb4"/>
  <text x="92" y="352" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Layer 2 — Project</text>
  <text x="950" y="352" text-anchor="end" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="18">overrides layer 3</text>
  <rect x="72" y="386" width="900" height="60" rx="10" fill="#143f72"/>
  <text x="92" y="422" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Layer 3 — Framework</text>
  <text x="950" y="422" text-anchor="end" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="18">base rules, security floor</text>
  <text x="72" y="500" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="18">Validation script catches silent overrides at CI, not in production</text>
  <text x="72" y="604" fill="#617086" font-family="Segoe UI, Arial, sans-serif" font-size="18">Agents · rules · precedence · CI validation</text>
