  <text x="72" y="150" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700">1,000 agent sessions through a scoring harness</text>
  <text x="72" y="194" fill="#4b5565" font-family="Segoe UI, Arial, sans-serif" font-size="22">Cases · drills · triggers — three regressions caught before rollout</text>
  
