  <text x="92" y="352" fill="#4b5565" font-family="Segoe UI, Arial, sans-serif" font-size="16">Pass criteria + rubric judge</text>
  <rect x="432" y="246" width="340" height="130" rx="12" fill="#ffffff" stroke="#1a5fb4" stroke-width="2"/>
