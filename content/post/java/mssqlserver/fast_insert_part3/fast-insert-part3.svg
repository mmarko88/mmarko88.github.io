<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Multi-value INSERT sweep</title>
  <desc id="description">On SQL Server, multi-value INSERT with 200 values per statement is 4.8 times faster than single-row batching — 828 milliseconds versus 3,984 milliseconds for 100,000 inserts.</desc>
  <rect width="1200" height="630" fill="#f7f9fc"/>
  <rect x="0" y="0" width="1200" height="12" fill="#1a5fb4"/>
  <text x="72" y="76" fill="#1a5fb4" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2">FAST INSERTS IN SQL SERVER · 03/08</text>
  <text x="72" y="158" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700">Multi-value 200: 4.8× speedup</text>
  <text x="72" y="202" fill="#4b5565" font-family="Segoe UI, Arial, sans-serif" font-size="26">100,000 inserts · JdbcTemplate · values per INSERT statement</text>

  <text x="330" y="276" text-anchor="end" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">200 values</text>
  <rect x="360" y="246" width="166" height="42" rx="10" fill="#17864b"/>
  <text x="544" y="276" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">828 ms</text>

  <text x="330" y="346" text-anchor="end" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">100 values</text>
  <rect x="360" y="316" width="196" height="42" rx="10" fill="#1a5fb4"/>
  <text x="574" y="346" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">983 ms</text>

  <text x="330" y="416" text-anchor="end" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">50 values</text>
  <rect x="360" y="386" width="208" height="42" rx="10" fill="#1a5fb4"/>
  <text x="586" y="416" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">1,038 ms</text>

  <text x="330" y="486" text-anchor="end" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">10 values</text>
  <rect x="360" y="456" width="342" height="42" rx="10" fill="#1a5fb4"/>
  <text x="720" y="486" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">1,711 ms</text>

  <text x="330" y="556" text-anchor="end" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">1 value (baseline)</text>
  <rect x="360" y="526" width="796" height="42" rx="10" fill="#6b7280"/>
  <text x="1056" y="556" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">3,984 ms</text>

  <rect x="986" y="238" width="156" height="76" rx="16" fill="#173f6d"/>
  <text x="1064" y="276" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">4.8×</text>
  <text x="1064" y="302" text-anchor="middle" fill="#cce6ff" font-family="Segoe UI, Arial, sans-serif" font-size="16">faster</text>

  <text x="72" y="604" fill="#617086" font-family="Segoe UI, Arial, sans-serif" font-size="20">Java · JdbcTemplate · multi-row VALUES · Microsoft SQL Server</text>
</svg>
