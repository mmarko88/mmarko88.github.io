<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Reliable Java benchmarking environment for SQL Server</title>
  <desc id="description">A quick-start checklist for Java benchmarking environments: SSD storage, 8 GB RAM, localhost, close SSMS, 1 warm-up + 10 timed runs + median. HDD adds 22% variability vs SSD's 3%.</desc>

  <rect width="1200" height="630" fill="#f7f9fc"/>
  <rect x="0" y="0" width="1200" height="12" fill="#1a5fb4"/>

  <text x="72" y="76" fill="#1a5fb4" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2">FAST INSERTS IN SQL SERVER · ENVIRONMENT</text>
  <text x="72" y="150" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700">Reliable benchmarking environment</text>
  <text x="72" y="192" fill="#4b5565" font-family="Segoe UI, Arial, sans-serif" font-size="22">Your numbers are only as reliable as your environment — a checklist</text>

  <!-- Storage comparison -->
  <text x="330" y="264" text-anchor="end" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">NVMe SSD</text>
  <rect x="360" y="234" width="88" height="42" rx="10" fill="#17864b"/>
  <text x="466" y="264" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">492 ms · 3% CoV</text>

  <text x="330" y="322" text-anchor="end" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">HDD 7200 RPM</text>
  <rect x="360" y="292" width="328" height="42" rx="10" fill="#c0392b"/>
  <text x="706" y="322" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">1,840 ms · 22% CoV</text>

  <rect x="950" y="234" width="180" height="100" rx="16" fill="#173f6d"/>
  <text x="1040" y="280" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">3.7×</text>
  <text x="1040" y="310" text-anchor="middle" fill="#cce6ff" font-family="Segoe UI, Arial, sans-serif" font-size="16">slower on HDD</text>

  <!-- Checklist -->
  <text x="72" y="400" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Quick-start checklist</text>

  <text x="92" y="440" fill="#17864b" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">✓</text>
  <text x="116" y="440" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="18">SSD storage (not HDD)</text>
  <text x="360" y="440" fill="#17864b" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">✓</text>
  <text x="384" y="440" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="18">8 GB RAM minimum</text>
  <text x="612" y="440" fill="#17864b" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">✓</text>
  <text x="636" y="440" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="18">SQL Server on localhost</text>

  <text x="92" y="474" fill="#17864b" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">✓</text>
  <text x="116" y="474" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="18">Close SSMS query windows</text>
  <text x="360" y="474" fill="#17864b" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">✓</text>
  <text x="384" y="474" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="18">Laptop plugged in</text>
  <text x="612" y="474" fill="#17864b" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">✓</text>
  <text x="636" y="474" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="18">Run baseline first</text>

  <rect x="72" y="506" width="1056" height="44" rx="10" fill="#d9f2e4"/>
  <text x="600" y="534" text-anchor="middle" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Methodology: 1 warm-up run + 10 timed runs + report the median</text>

  <text x="72" y="604" fill="#617086" font-family="Segoe UI, Arial, sans-serif" font-size="18">Java 17 · SQL Server 2025 Express · Windows 11 · NVMe SSD</text>
</svg>
