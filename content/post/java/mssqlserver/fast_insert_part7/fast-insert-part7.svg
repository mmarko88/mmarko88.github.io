<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Index impact benchmark</title>
  <desc id="description">Adding 5 non-clustered indexes to a SQL Server table makes Bulk API inserts 6.7 times slower — 5,290 milliseconds versus 784 milliseconds for 100,000 rows.</desc>
  <rect width="1200" height="630" fill="#f7f9fc"/>
  <rect x="0" y="0" width="1200" height="12" fill="#1a5fb4"/>
  <text x="72" y="76" fill="#1a5fb4" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2">FAST INSERTS IN SQL SERVER · 07/08</text>
  <text x="72" y="158" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700">5 indexes: 6.7× slower</text>
  <text x="72" y="202" fill="#4b5565" font-family="Segoe UI, Arial, sans-serif" font-size="26">100,000 inserts · Bulk API · 0, 1, 3, 5 non-clustered indexes</text>

  <text x="330" y="276" text-anchor="end" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">0 indexes (baseline)</text>
  <rect x="360" y="246" width="128" height="42" rx="10" fill="#17864b"/>
  <text x="506" y="276" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">784 ms</text>

  <text x="330" y="346" text-anchor="end" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">1 index</text>
  <rect x="360" y="316" width="298" height="42" rx="10" fill="#f6c344"/>
  <text x="676" y="346" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">1,829 ms</text>

  <text x="330" y="416" text-anchor="end" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">3 indexes</text>
  <rect x="360" y="386" width="592" height="42" rx="10" fill="#e58b2e"/>
  <text x="970" y="416" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">3,632 ms</text>

  <text x="330" y="486" text-anchor="end" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">5 indexes</text>
  <rect x="360" y="456" width="800" height="42" rx="10" fill="#c0392b"/>
  <text x="1178" y="486" text-anchor="end" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">5,290 ms</text>

  <rect x="986" y="238" width="156" height="76" rx="16" fill="#173f6d"/>
  <text x="1064" y="276" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">6.7×</text>
  <text x="1064" y="302" text-anchor="middle" fill="#cce6ff" font-family="Segoe UI, Arial, sans-serif" font-size="16">slower</text>

  <text x="72" y="604" fill="#617086" font-family="Segoe UI, Arial, sans-serif" font-size="20">Java · Bulk Copy API · Index maintenance tax · Microsoft SQL Server</text>
</svg>
