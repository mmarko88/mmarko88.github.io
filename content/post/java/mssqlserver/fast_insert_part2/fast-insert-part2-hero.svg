<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .bg{fill:#f7f9fc}.panel{fill:#ffffff;stroke:#d5dde8}.ink{fill:#172033}.mut{fill:#617086}.foot{fill:#617086}
    @media (prefers-color-scheme: dark){
      .bg{fill:#172033}.panel{fill:#222e45;stroke:#3a4a68}.ink{fill:#ffffff}.mut{fill:#9aa8bf}.foot{fill:#5b6a84}
    }
  </style>

  <rect class="bg" width="1200" height="630"/>
  <rect width="1200" height="12" fill="#1a5fb4"/>

  <text x="72" y="56" fill="#1a5fb4" font-size="24" font-weight="700" letter-spacing="2">FASTEST INSERTS · PART 2 · JDBC</text>
  <text class="ink" x="72" y="128" font-size="56" font-weight="700">The winner also finished last.</text>
  <text class="mut" x="72" y="168" font-size="21">SQLServerBulkCopy · 100,000 rows — batch size is the only variable</text>

  <!-- warning sign (C) -->
  <g transform="translate(215,330)">
    <path class="warn" d="M0 -95 L105 70 L-105 70 Z" fill="#f5b93f" stroke-width="5" style="stroke:#172033"/>
    <text x="0" y="42" fill="#172033" font-size="72" font-weight="700" text-anchor="middle">!</text>
  </g>

  <!-- the spread (D) -->
  <text x="380" y="330" fill="#ca3f3f" font-size="52" font-weight="700">10,178 ms</text>
  <text class="mut" x="380" y="368" font-size="19">batch = 10</text>
  <text x="690" y="330" fill="#17864b" font-size="52" font-weight="700">314 ms</text>
  <text class="mut" x="690" y="368" font-size="19">batch = 10,000</text>

  <!-- arrow between -->
  <text class="ink" x="650" y="330" font-size="60" font-weight="700">→</text>

  <!-- 32x callout -->
  <text class="ink" x="380" y="420" font-size="30" font-weight="700">32× apart — nothing else changed</text>

  <!-- fix chip (C) -->
  <rect x="72" y="470" width="480" height="56" rx="10" fill="#1f5c3d" stroke="#17864b" stroke-width="2"/>
  <text x="312" y="506" fill="#d9f2e4" font-family="Consolas, Menlo, monospace" font-size="20" text-anchor="middle">options.setBatchSize(10_000) → 314 ms</text>

  <!-- best of the rest (D) -->
  <rect class="panel" x="920" y="215" width="208" height="290" rx="12" stroke-width="2"/>
  <text class="mut" x="944" y="255" font-size="15" font-weight="700" letter-spacing="1">BEST OF THE REST</text>
  <text class="ink" x="944" y="295" font-size="19" font-weight="600">JdbcTemplate</text>
  <text class="mut" x="944" y="321" font-size="17">1,509 ms</text>
  <text class="ink" x="944" y="361" font-size="19" font-weight="600">PreparedStmt</text>
  <text class="mut" x="944" y="387" font-size="17">1,520 ms</text>
  <text class="ink" x="944" y="427" font-size="19" font-weight="600">Hibernate</text>
  <text class="mut" x="944" y="453" font-size="17">1,732 ms</text>
  <text x="944" y="488" fill="#17864b" font-size="15" font-weight="700">all @ batch 10,000</text>

  <text class="mut" x="72" y="570" font-size="20">Winner of the benchmark is a parameter, not a library.</text>
  <text class="foot" x="72" y="606" font-size="18">Java · SQL Server · professionaldev.dev</text>
</svg>
