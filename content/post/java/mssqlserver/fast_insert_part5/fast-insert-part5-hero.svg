<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .bg{fill:#172033}.panel{fill:#222e45;stroke:#3a4a68}.ink{fill:#ffffff}.mut{fill:#9aa8bf}.foot{fill:#5b6a84}.dead{fill:#3a4a68}.deadTxt{fill:#5b6a84}.deadLever{stroke:#5b6a84}
    @media (prefers-color-scheme: light){
      .bg{fill:#f7f9fc}.panel{fill:#ffffff;stroke:#d5dde8}.ink{fill:#172033}.mut{fill:#617086}.foot{fill:#617086}.dead{fill:#d5dde8}.deadTxt{fill:#617086}.deadLever{stroke:#9aa8bf}
    }
  </style>

  <rect class="bg" width="1200" height="630"/>
  <rect width="1200" height="12" fill="#1a5fb4"/>

  <text x="72" y="56" fill="#1a5fb4" font-size="24" font-weight="700" letter-spacing="2">FASTEST INSERTS · PART 5 · HIBERNATE</text>
  <text class="ink" x="72" y="128" font-size="56" font-weight="700">Flip three breakers.</text>
  <text class="mut" x="72" y="168" font-size="21">the whole tune-up, drawn as a panel</text>

  <!-- breaker panel -->
  <rect class="panel" x="72" y="200" width="560" height="332" rx="14" stroke-width="2"/>
  <text class="foot" x="96" y="238" font-size="15" font-weight="700" letter-spacing="1.5">INSERT SUBPANEL</text>

  <g class="ink" font-family="Consolas, Menlo, monospace" font-size="18">
    <rect x="96" y="262" width="48" height="72" rx="6" fill="#17864b"/>
    <path d="M120 268 L120 306" stroke="#d9f2e4" stroke-width="8"/>
    <text x="164" y="300">PERSISTABLE <tspan fill="#17864b" font-weight="700">ON</tspan></text>

    <rect x="96" y="352" width="48" height="72" rx="6" fill="#17864b"/>
    <path d="M120 358 L120 396" stroke="#d9f2e4" stroke-width="8"/>
    <text x="164" y="390">STATELESS_SESSION <tspan fill="#17864b" font-weight="700">ON</tspan></text>

    <rect x="96" y="442" width="48" height="72" rx="6" fill="#17864b"/>
    <path d="M120 448 L120 486" stroke="#d9f2e4" stroke-width="8"/>
    <text x="164" y="480">BULK_COPY_FLAG <tspan fill="#17864b" font-weight="700">ON</tspan></text>
  </g>

  <!-- dead breakers (smaller, off) -->
  <g class="deadTxt" font-family="Consolas, Menlo, monospace" font-size="14">
    <rect class="dead" x="396" y="262" width="30" height="50" rx="4"/>
    <path class="deadLever" d="M411 298 L411 280" stroke-width="6"/>
    <text x="438" y="290">ISOLATION <tspan>no effect</tspan></text>
    <rect class="dead" x="396" y="352" width="30" height="50" rx="4"/>
    <path class="deadLever" d="M411 388 L411 370" stroke-width="6"/>
    <text x="438" y="380">GC_TUNING <tspan>no effect</tspan></text>
    <rect class="dead" x="396" y="442" width="30" height="50" rx="4"/>
    <path class="deadLever" d="M411 478 L411 460" stroke-width="6"/>
    <text x="438" y="470">UNICODE_FLAG <tspan>no effect</tspan></text>
  </g>

  <!-- output meter -->
  <rect x="680" y="200" width="448" height="300" rx="14" class="panel" stroke="#17864b" stroke-width="2.5"/>
  <text class="foot" x="704" y="238" font-size="15" font-weight="700" letter-spacing="1.5">OUTPUT · 100k ROWS</text>
  <text x="904" y="360" fill="#17864b" font-size="72" font-weight="700" text-anchor="middle">1,075 ms</text>
  <text class="mut" x="904" y="400" font-size="18" text-anchor="middle">was 27,794 ms before the panel</text>
  <rect x="800" y="440" width="208" height="40" rx="20" fill="#1f5c3d" stroke="#17864b" stroke-width="2"/>
  <text x="904" y="466" fill="#d9f2e4" font-size="16" font-weight="700" text-anchor="middle">2× off bare metal</text>

  <text class="mut" x="72" y="560" font-size="20">The rest of the panel is decorative — measured, not assumed.</text>
  <text class="foot" x="72" y="606" font-size="18">Java · Hibernate · professionaldev.dev</text>
</svg>
