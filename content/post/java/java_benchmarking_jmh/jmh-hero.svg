<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Java Benchmarking With JMH</title>
  <desc id="description">JMH explained: warm-up iterations fix JIT noise, Blackhole prevents dead-code elimination, forking isolates benchmarks. When to use JMH vs a timed loop.</desc>

  <rect width="1200" height="630" fill="#f7f9fc"/>
  <rect x="0" y="0" width="1200" height="12" fill="#1a5fb4"/>

  <text x="72" y="76" fill="#1a5fb4" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2">JAVA · BENCHMARKING · JMH</text>
  <text x="72" y="150" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700">What each JMH parameter does</text>
  <text x="72" y="192" fill="#4b5565" font-family="Segoe UI, Arial, sans-serif" font-size="22">Three problems with timing loops — three JMH solutions</text>

  <!-- Three problem/solution cards -->
  <rect x="72" y="226" width="340" height="180" rx="12" fill="#ffffff" stroke="#ca3f3f" stroke-width="2"/>
  <text x="92" y="258" fill="#ca3f3f" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">PROBLEM</text>
  <text x="92" y="286" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">JIT compilation</text>
  <text x="92" y="314" fill="#617086" font-family="Segoe UI, Arial, sans-serif" font-size="16">Code gets faster as the</text>
  <text x="92" y="336" fill="#617086" font-family="Segoe UI, Arial, sans-serif" font-size="16">JVM compiles it (C1 → C2)</text>
  <text x="92" y="370" fill="#17864b" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">FIX: @Warmup(5)</text>
  <text x="92" y="394" fill="#617086" font-family="Segoe UI, Arial, sans-serif" font-size="14">discard first N iterations</text>

  <rect x="432" y="226" width="340" height="180" rx="12" fill="#ffffff" stroke="#ca3f3f" stroke-width="2"/>
  <text x="452" y="258" fill="#ca3f3f" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">PROBLEM</text>
  <text x="452" y="286" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Dead-code elimination</text>
  <text x="452" y="314" fill="#617086" font-family="Segoe UI, Arial, sans-serif" font-size="16">JIT removes code whose</text>
  <text x="452" y="336" fill="#617086" font-family="Segoe UI, Arial, sans-serif" font-size="16">result is never used</text>
  <text x="452" y="370" fill="#17864b" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">FIX: Blackhole.consume()</text>
  <text x="452" y="394" fill="#617086" font-family="Segoe UI, Arial, sans-serif" font-size="14">unprovably-used result sink</text>

  <rect x="792" y="226" width="340" height="180" rx="12" fill="#ffffff" stroke="#ca3f3f" stroke-width="2"/>
  <text x="812" y="258" fill="#ca3f3f" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">PROBLEM</text>
  <text x="812" y="286" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Profile pollution</text>
  <text x="812" y="314" fill="#617086" font-family="Segoe UI, Arial, sans-serif" font-size="16">Benchmark A's optimisations</text>
  <text x="812" y="336" fill="#617086" font-family="Segoe UI, Arial, sans-serif" font-size="16">leak into benchmark B</text>
  <text x="812" y="370" fill="#17864b" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">FIX: @Fork(3)</text>
  <text x="812" y="394" fill="#617086" font-family="Segoe UI, Arial, sans-serif" font-size="14">fresh JVM per benchmark</text>

  <!-- When to use JMH vs timed loop -->
  <rect x="72" y="438" width="1056" height="100" rx="12" fill="#d9f2e4"/>
  <text x="92" y="472" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">When to use what</text>
  <text x="92" y="504" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="17">Nanoseconds → use JMH (JIT/GC dominate)</text>
  <text x="540" y="504" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="17">Seconds → timed loop + median (DB/disk dominate)</text>
  <text x="92" y="526" fill="#617086" font-family="Segoe UI, Arial, sans-serif" font-size="15">String concat, collection lookup, regex</text>
  <text x="540" y="526" fill="#617086" font-family="Segoe UI, Arial, sans-serif" font-size="15">SQL inserts, file I/O, HTTP calls</text>

  <text x="72" y="604" fill="#617086" font-family="Segoe UI, Arial, sans-serif" font-size="18">Java · OpenJDK JMH · Aleksey Shipilev · @Benchmark</text>
</svg>
