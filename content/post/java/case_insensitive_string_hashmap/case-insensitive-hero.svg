<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Segoe UI, Arial, sans-serif" data-theme-palette=""><!-- cascade:theme-palette --><style>html[data-mode='dim'] [data-theme-palette] .bg{fill:#172033}html[data-mode='dim'] [data-theme-palette] .panel{fill:#222e45;stroke:#3a4a68}html[data-mode='dim'] [data-theme-palette] .ink{fill:#ffffff}html[data-mode='dim'] [data-theme-palette] .mut{fill:#9aa8bf}html[data-mode='dim'] [data-theme-palette] .chip{fill:#1a2333;stroke:#3a4a68}html[data-mode='dim'] [data-theme-palette] .foot{fill:#5b6a84}html[data-mode='lit'] [data-theme-palette] .bg{fill:#f7f9fc}html[data-mode='lit'] [data-theme-palette] .panel{fill:#ffffff;stroke:#d5dde8}html[data-mode='lit'] [data-theme-palette] .ink{fill:#172033}html[data-mode='lit'] [data-theme-palette] .mut{fill:#617086}html[data-mode='lit'] [data-theme-palette] .chip{fill:#f0f4f9;stroke:#e2e8f0}html[data-mode='lit'] [data-theme-palette] .foot{fill:#617086}</style>
  <style>
    .bg{fill:#f7f9fc}.panel{fill:#ffffff;stroke:#d5dde8}.ink{fill:#172033}.mut{fill:#617086}.chip{fill:#f0f4f9;stroke:#e2e8f0}.foot{fill:#617086}
    @media (prefers-color-scheme: dark){
      .bg{fill:#172033}.panel{fill:#222e45;stroke:#3a4a68}.ink{fill:#ffffff}.mut{fill:#9aa8bf}.chip{fill:#1a2333;stroke:#3a4a68}.foot{fill:#5b6a84}
    }
  </style>

  <rect class="bg" width="1200" height="630"/>
  <rect width="1200" height="12" fill="#1a5fb4"/>

  <text x="72" y="56" fill="#1a5fb4" font-size="24" font-weight="700" letter-spacing="2">JAVA · HASHMAP · STRINGS</text>
  <text class="ink" x="72" y="126" font-size="54" font-weight="700">Found in SQL. Lost in Java.</text>
  <text class="mut" x="72" y="164" font-size="21">The same email, two opposite answers — the case-sensitivity trap</text>

  <!-- ===== left panel: SQL Server ===== -->
  <rect class="panel" x="72" y="198" width="510" height="280" rx="14" stroke-width="2"/>

  <!-- DB cylinder icon -->
  <g transform="translate(102,222)">
    <ellipse cx="40" cy="12" rx="40" ry="12" fill="#1a5fb4"/>
    <path d="M0 12 v44 c0 7 18 12 40 12 s40-5 40-12 V12" fill="#1a5fb4" opacity="0.85"/>
    <ellipse cx="40" cy="34" rx="40" ry="12" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
    <ellipse cx="40" cy="48" rx="40" ry="12" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  </g>
  <text class="mut" x="200" y="248" font-size="18" font-weight="700" letter-spacing="1.5">SQL SERVER</text>
  <text class="mut" x="200" y="272" font-size="15">case-insensitive</text>

  <!-- query -->
  <text class="ink" x="98" y="316" font-family="Consolas, Menlo, monospace" font-size="21">WHERE email = 'BOB@example.com'</text>

  <!-- row returned: envelope icon + key -->
  <rect class="chip" x="98" y="334" width="360" height="48" rx="8" stroke-width="1.5"/>
  <g transform="translate(110,344)">
    <rect width="30" height="22" rx="3" fill="none" stroke="#17864b" stroke-width="2.5"/>
    <path d="M0 3 L15 14 L30 3" fill="none" stroke="#17864b" stroke-width="2.5"/>
  </g>
  <text class="ink" x="152" y="365" font-family="Consolas, Menlo, monospace" font-size="21">Bob@example.com</text>
  <text class="mut" x="466" y="365" font-size="14">row</text>

  <!-- verdict -->
  <rect x="98" y="408" width="140" height="50" rx="25" fill="#d9f2e4"/>
  <text x="168" y="441" fill="#17864b" font-size="24" font-weight="700" text-anchor="middle">FOUND</text>
  <text x="258" y="442" fill="#17864b" font-size="26" font-weight="700">✓</text>

  <!-- ===== right panel: Java HashMap ===== -->
  <rect class="panel" x="618" y="198" width="510" height="280" rx="14" stroke-width="2"/>

  <!-- coffee cup icon -->
  <g transform="translate(648,224)">
    <path d="M0 10 h56 v24 a20 20 0 0 1-20 20 H20 A20 20 0 0 1 0 34 Z" fill="#ca8a3f"/>
    <path d="M56 15 h9 a11 11 0 0 1 0 22 h-9" fill="none" stroke="#ca8a3f" stroke-width="4"/>
    <path d="M14 4 q4 -5 0 -9 M28 4 q4 -5 0 -9 M42 4 q4 -5 0 -9" fill="none" stroke="#ca8a3f" stroke-width="3" stroke-linecap="round" transform="translate(0,10)"/>
  </g>
  <text class="mut" x="746" y="248" font-size="18" font-weight="700" letter-spacing="1.5">JAVA HASHMAP</text>
  <text class="mut" x="746" y="272" font-size="15">case-sensitive keys</text>

  <!-- stored key chip -->
  <rect class="chip" x="644" y="292" width="360" height="44" rx="8" stroke-width="1.5"/>
  <text class="ink" x="660" y="321" font-family="Consolas, Menlo, monospace" font-size="21">Bob@example.com</text>
  <text class="mut" x="1012" y="321" font-size="14">stored</text>

  <!-- lookup -->
  <text class="ink" x="644" y="372" font-family="Consolas, Menlo, monospace" font-size="21">get("BOB@example.com")</text>

  <!-- verdict -->
  <rect x="644" y="408" width="140" height="50" rx="25" fill="#fde8e8"/>
  <text x="714" y="441" fill="#ca3f3f" font-size="24" font-weight="700" text-anchor="middle">null</text>
  <text x="804" y="442" fill="#ca3f3f" font-size="26" font-weight="700">✗</text>

  <!-- same-person connector -->
  <path d="M238 478 C 300 528, 640 528, 714 478" fill="none" stroke="#1a5fb4" stroke-width="2.5" stroke-dasharray="7 6" opacity="0.7"/>
  <rect class="bg" x="496" y="508" width="230" height="26" rx="7"/>
  <circle cx="476" cy="522" r="13" fill="#1a5fb4"/>
  <circle cx="476" cy="518" r="4" fill="#ffffff"/>
  <path d="M470 528 a6 5 0 0 1 12 0 z" fill="#ffffff"/>
  <text class="mut" x="500" y="528" font-size="16" font-style="italic">same person, two casings</text>

  <text class="mut" x="72" y="556" font-size="20">The row exists. The lookup still misses.</text>
  <text class="foot" x="72" y="606" font-size="18">Java · HashMap · professionaldev.dev</text>
</svg>
