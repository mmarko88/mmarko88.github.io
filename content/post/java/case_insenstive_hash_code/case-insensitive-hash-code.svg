<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .bg{fill:#f7f9fc}.panel{fill:#ffffff;stroke:#d5dde8}.ink{fill:#172033}.mut{fill:#617086}.foot{fill:#617086}.door{fill:#172033;stroke:none}
    @media (prefers-color-scheme: dark){
      .bg{fill:#172033}.panel{fill:#222e45;stroke:#3a4a68}.ink{fill:#ffffff}.mut{fill:#9aa8bf}.foot{fill:#5b6a84}.door{fill:#222e45;stroke:#4a5b78;stroke-width:2}
    }
  </style>

  <rect class="bg" width="1200" height="630"/>
  <rect width="1200" height="12" fill="#1a5fb4"/>

  <text x="72" y="56" fill="#1a5fb4" font-size="24" font-weight="700" letter-spacing="2">JAVA · HASHCODE · RECORDS</text>
  <text class="ink" x="72" y="128" font-size="56" font-weight="700">One recipe. Every field.</text>
  <text class="mut" x="72" y="168" font-size="21">Teach the door case-insensitive compare — don't reprint every badge</text>

  <!-- left badge -->
  <g transform="translate(150,240)">
    <rect class="panel" x="-90" y="-60" width="180" height="120" rx="10" stroke-width="2"/>
    <circle cx="0" cy="-18" r="22" fill="#1a5fb4"/>
    <circle cx="0" cy="-24" r="8" fill="#ffffff"/>
    <path d="M-10 -12 a10 8 0 0 1 20 0 z" fill="#ffffff"/>
    <text class="ink" x="0" y="34" font-family="Consolas, Menlo, monospace" font-size="22" text-anchor="middle">john smith</text>
  </g>
  <!-- right badge -->
  <g transform="translate(1050,240)">
    <rect class="panel" x="-90" y="-60" width="180" height="120" rx="10" stroke-width="2"/>
    <circle cx="0" cy="-18" r="22" fill="#1a5fb4"/>
    <circle cx="0" cy="-24" r="8" fill="#ffffff"/>
    <path d="M-10 -12 a10 8 0 0 1 20 0 z" fill="#ffffff"/>
    <text class="ink" x="0" y="34" font-family="Consolas, Menlo, monospace" font-size="22" text-anchor="middle">JOHN SMITH</text>
  </g>

  <!-- scanner door -->
  <g transform="translate(600,300)">
    <rect class="door" x="-120" y="-100" width="240" height="200" rx="16"/>
    <rect x="-92" y="-70" width="184" height="70" rx="10" fill="#d9f2e4"/>
    <text x="0" y="-28" fill="#17864b" font-size="30" font-weight="700" text-anchor="middle">MATCH ✓</text>
    <rect x="-60" y="16" width="120" height="26" rx="6" fill="#3a4a68"/>
    <text x="0" y="34" fill="#9aa8bf" font-size="14" text-anchor="middle">case-insensitive</text>
    <rect x="-40" y="56" width="80" height="18" rx="5" fill="#1a5fb4"/>
  </g>

  <!-- paths from badges to door -->
  <path d="M250 240 C 380 180, 440 200, 480 232" fill="none" stroke="#1a5fb4" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#f)"/>
  <path d="M950 240 C 820 180, 760 200, 720 232" fill="none" stroke="#1a5fb4" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#f)"/>

  <!-- paired verdicts: allocation count -->
  <g transform="translate(600,468)">
    <rect x="-330" y="-34" width="310" height="52" rx="8" fill="#fde8e8"/>
    <text x="-175" y="-2" fill="#ca3f3f" font-size="19" font-weight="700" text-anchor="middle">wrap each field: +N objects ✗</text>
    <rect x="30" y="-34" width="260" height="52" rx="8" fill="#d9f2e4"/>
    <text x="160" y="-2" fill="#17864b" font-size="19" font-weight="700" text-anchor="middle">utils: +0 objects ✓</text>
  </g>

  <!-- B's recipe line -->
  <text class="mut" x="72" y="545" font-family="Consolas, Menlo, monospace" font-size="19">recipe: ciHashCode per field → 31·h₁ + h₂ — both casings, one bucket</text>
  <text class="mut" x="72" y="580" font-size="20">equals() and hashCode() stay on the record, not the string</text>
  <text class="foot" x="72" y="612" font-size="18">Java · Strings · professionaldev.dev</text>

  <defs><marker id="f" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#1a5fb4"/></marker></defs>
</svg>
