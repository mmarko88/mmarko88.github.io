<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Case-insensitive HashMap lookup in Java</title>
  <desc id="description">A Java HashMap populated with the key "john@example.com" is successfully queried with "JOHN@EXAMPLE.COM" via a custom case-insensitive wrapper key — the lookup returns the stored user with zero new String allocations per get.</desc>

  <rect width="1200" height="630" fill="#f7f9fc"/>
  <rect x="0" y="0" width="1200" height="12" fill="#1a5fb4"/>

  <text x="72" y="76" fill="#1a5fb4" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2">JAVA · HASHMAP · CASE-INSENSITIVE</text>
  <text x="72" y="150" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700">Case-insensitive HashMap lookup</text>
  <text x="72" y="194" fill="#4b5565" font-family="Segoe UI, Arial, sans-serif" font-size="24">Custom wrapper key · zero new String allocations per get()</text>

  <!-- put() block -->
  <rect x="72" y="246" width="500" height="112" rx="12" fill="#ffffff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="92" y="282" fill="#617086" font-family="Consolas, 'Courier New', monospace" font-size="16">// store once, lowercase</text>
  <text x="92" y="316" fill="#172033" font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="700">map.put(ci(<tspan fill="#ca3f3f">"john@example.com"</tspan>), user);</text>
  <text x="92" y="342" fill="#617086" font-family="Consolas, 'Courier New', monospace" font-size="14">key hashed from a lowered view, no copy</text>

  <!-- get() block -->
  <rect x="628" y="246" width="500" height="112" rx="12" fill="#ffffff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="648" y="282" fill="#617086" font-family="Consolas, 'Courier New', monospace" font-size="16">// lookup with any case</text>
  <text x="648" y="316" fill="#172033" font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="700">map.get(ci(<tspan fill="#ca3f3f">"JOHN@EXAMPLE.COM"</tspan>));</text>
  <text x="648" y="342" fill="#617086" font-family="Consolas, 'Courier New', monospace" font-size="14">same hash, same bucket, no new String</text>

  <!-- Arrow from put to get -->
  <path d="M322 400 L322 436 M870 400 L870 436" stroke="#1a5fb4" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M314 428 L322 436 L330 428" stroke="#1a5fb4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M862 428 L870 436 L878 428" stroke="#1a5fb4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Result -->
  <rect x="72" y="446" width="1056" height="92" rx="46" fill="#17864b"/>
  <text x="600" y="483" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">→ returns the same user</text>
  <text x="600" y="517" text-anchor="middle" fill="#d9f2e4" font-family="Segoe UI, Arial, sans-serif" font-size="18">one wrapper type · overrides hashCode() and equals() with locale-insensitive comparison</text>

  <!-- Footer -->
  <text x="72" y="604" fill="#617086" font-family="Segoe UI, Arial, sans-serif" font-size="18">Java · HashMap · hashCode · equals · no String.toLowerCase() per lookup</text>
</svg>
