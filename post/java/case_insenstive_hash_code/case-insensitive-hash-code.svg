<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Case-insensitive equals and hashCode for records with multiple String fields</title>
  <desc id="description">Two Java Person records differing only in case — "John Smith" and "JOHN smith" — are shown being compared with .equals() returning true, demonstrating case-insensitive equality on multiple String fields without wrapping each String.</desc>

  <rect width="1200" height="630" fill="#f7f9fc"/>
  <rect x="0" y="0" width="1200" height="12" fill="#1a5fb4"/>

  <text x="72" y="76" fill="#1a5fb4" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2">JAVA · EQUALS &amp; HASHCODE</text>
  <text x="72" y="150" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700">Case-insensitive equals, no wrapper</text>
  <text x="72" y="194" fill="#4b5565" font-family="Segoe UI, Arial, sans-serif" font-size="24">Multiple String fields · one override · zero extra allocations</text>

  <!-- Left: original Person instance -->
  <rect x="72" y="248" width="360" height="190" rx="12" fill="#ffffff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="92" y="282" fill="#617086" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="400">new Person(</text>
  <text x="92" y="320" fill="#172033" font-family="Consolas, 'Courier New', monospace" font-size="24" font-weight="700">
    <tspan fill="#ca3f3f">"John"</tspan>, <tspan fill="#ca3f3f">"Smith"</tspan>
  </text>
  <text x="92" y="348" fill="#617086" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="400">)</text>
  <text x="92" y="396" fill="#617086" font-family="Segoe UI, Arial, sans-serif" font-size="15">firstName · lastName</text>

  <!-- .equals() middle — single line, centered vertically between the cards -->
  <text x="600" y="355" text-anchor="middle" fill="#172033" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700">.equals( )</text>

  <!-- Right: differently-cased Person instance -->
  <rect x="768" y="248" width="360" height="190" rx="12" fill="#ffffff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="788" y="282" fill="#617086" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="400">new Person(</text>
  <text x="788" y="320" fill="#172033" font-family="Consolas, 'Courier New', monospace" font-size="24" font-weight="700">
    <tspan fill="#ca3f3f">"JOHN"</tspan>, <tspan fill="#ca3f3f">"smith"</tspan>
  </text>
  <text x="788" y="348" fill="#617086" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="400">)</text>
  <text x="788" y="396" fill="#617086" font-family="Segoe UI, Arial, sans-serif" font-size="15">different casing, same identity</text>

  <!-- Arrow Right  -->
  <path d="M470 342 L540 342 M525 334 L540 342 L525 350" stroke="#1a5fb4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M660 342 L730 342 M715 334 L730 342 L715 350" stroke="#1a5fb4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Result -->
  <rect x="440" y="486" width="320" height="68" rx="34" fill="#17864b"/>
  <text x="600" y="531" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">→ true ✓</text>

  <!-- Footer -->
  <text x="72" y="604" fill="#617086" font-family="Segoe UI, Arial, sans-serif" font-size="18">Java · record · Objects · String.equalsIgnoreCase · one override, no per-field wrapper</text>
</svg>
