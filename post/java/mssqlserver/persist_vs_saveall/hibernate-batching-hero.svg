<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .bg{fill:#f7f9fc}.panel{fill:#ffffff;stroke:#d5dde8}.ink{fill:#172033}.mut{fill:#617086}.foot{fill:#617086}.fig{fill:#172033}.sub{fill:#eef2f8;stroke:#d5dde8}.body{fill:#f7f9fc}
    @media (prefers-color-scheme: dark){
      .bg{fill:#172033}.panel{fill:#222e45;stroke:#3a4a68}.ink{fill:#ffffff}.mut{fill:#9aa8bf}.foot{fill:#5b6a84}.fig{fill:#dfe6f2}.sub{fill:#1d2940;stroke:#3a4a68}.body{fill:#172033}
    }
  </style>

  <rect class="bg" width="1200" height="630"/>
  <rect width="1200" height="12" fill="#1a5fb4"/>

  <text x="72" y="56" fill="#1a5fb4" font-size="24" font-weight="700" letter-spacing="2">FASTEST INSERTS · PART 1 · HIBERNATE</text>
  <text class="ink" x="72" y="128" font-size="56" font-weight="700">saveAll() cards every single row.</text>
  <text class="mut" x="72" y="168" font-size="21">merge semantics — a SELECT before every INSERT, 100,000 times</text>

  <!-- service window -->
  <rect class="panel" x="830" y="195" width="298" height="235" rx="14" stroke-width="2"/>
  <rect x="830" y="195" width="298" height="42" rx="14" fill="#1a5fb4"/>
  <text x="979" y="224" fill="#ffffff" font-size="19" font-weight="700" text-anchor="middle">SQL SERVER · WINDOW 7</text>
  <!-- clerk -->
  <circle class="mut" cx="979" cy="300" r="30"/>
  <circle class="body" cx="979" cy="291" r="11"/>
  <path class="body" d="M964 308 a15 11 0 0 1 30 0 z"/>
  <!-- speech bubble -->
  <path class="panel" d="M860 266 q-4 -30 38 -34 l120 0 q24 0 24 21 q0 21 -24 21 l-100 0 -46 26 z" stroke-width="2.5"/>
  <text class="ink" x="974" y="266" font-size="24" font-weight="700" text-anchor="middle">ID?</text>
  <!-- counter -->
  <rect class="sub" x="830" y="360" width="298" height="70" stroke-width="2"/>
  <text class="mut" x="979" y="402" font-size="16" text-anchor="middle">please have your person_id ready</text>

  <!-- the row being carded -->
  <g transform="translate(680,360)">
    <circle class="fig" cx="0" cy="-40" r="22"/>
    <rect class="fig" x="-24" y="-18" width="48" height="64" rx="10"/>
    <rect class="panel" x="-52" y="-16" width="44" height="30" rx="5" stroke="#ca3f3f" stroke-width="2.5" transform="rotate(-12 -52 -16)"/>
    <text x="-38" y="5" fill="#ca3f3f" font-family="Consolas, Menlo, monospace" font-size="14" text-anchor="middle" transform="rotate(-12 -38 5)">id=7</text>
  </g>

  <!-- the queue -->
  <g class="fig" opacity="0.92">
    <circle cx="540" cy="320" r="22"/><rect x="516" y="342" width="48" height="64" rx="10"/>
    <circle cx="430" cy="320" r="22"/><rect x="406" y="342" width="48" height="64" rx="10"/>
    <circle cx="320" cy="320" r="22"/><rect x="296" y="342" width="48" height="64" rx="10"/>
    <circle cx="210" cy="320" r="22"/><rect x="186" y="342" width="48" height="64" rx="10"/>
    <circle cx="110" cy="320" r="22"/><rect x="86" y="342" width="48" height="64" rx="10"/>
  </g>
  <text x="72" y="440" fill="#ca3f3f" font-size="28" font-weight="700">… × 100,000 — each one asked first</text>

  <!-- C's profiler numbers -->
  <rect x="72" y="470" width="330" height="56" rx="8" fill="#fde8e8"/>
  <text x="237" y="506" fill="#ca3f3f" font-size="22" font-weight="700" text-anchor="middle">saveAll: 21.1 s</text>
  <rect x="418" y="470" width="330" height="56" rx="8" fill="#d9f2e4"/>
  <text x="583" y="506" fill="#17864b" font-size="22" font-weight="700" text-anchor="middle">persist + batch: 1.7 s</text>
  <rect class="panel" x="764" y="470" width="364" height="56" rx="8" stroke-width="2"/>
  <text class="mut" x="946" y="506" font-family="Consolas, Menlo, monospace" font-size="17" text-anchor="middle">select … where person_id=N</text>

  <text class="mut" x="72" y="580" font-size="20">The convenient API pays a round-trip before it even starts.</text>
  <text class="foot" x="72" y="612" font-size="18">Java · Hibernate · professionaldev.dev</text>
</svg>
