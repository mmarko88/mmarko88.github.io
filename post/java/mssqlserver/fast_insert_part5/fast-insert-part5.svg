<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Hibernate tuning benchmark</title>
  <desc id="description">Hibernate StatelessSession with useBulkCopyForBatchInsert closes 80% of the gap to the raw Bulk Copy API — 1,075 milliseconds versus 492 milliseconds for 100,000 SQL Server inserts.</desc>
  <rect width="1200" height="630" fill="#f7f9fc"/>
  <rect x="0" y="0" width="1200" height="12" fill="#1a5fb4"/>
  <text x="72" y="76" fill="#1a5fb4" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2">FAST INSERTS IN SQL SERVER · 05/08</text>
  <text x="72" y="158" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700">Hibernate → raw JDBC: 80% closed</text>
  <text x="72" y="202" fill="#4b5565" font-family="Segoe UI, Arial, sans-serif" font-size="26">100,000 inserts · four Hibernate configurations toward Bulk API</text>

  <text x="430" y="276" text-anchor="end" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">Bulk API (target)</text>
  <rect x="460" y="246" width="88" height="42" rx="10" fill="#17864b"/>
  <text x="566" y="276" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">492 ms</text>

  <text x="430" y="346" text-anchor="end" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">Stateless + bulkCopy</text>
  <rect x="460" y="316" width="192" height="42" rx="10" fill="#17864b" opacity="0.7"/>
  <text x="670" y="346" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">1,075 ms</text>

  <text x="430" y="416" text-anchor="end" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">StatelessSession</text>
  <rect x="460" y="386" width="473" height="42" rx="10" fill="#1a5fb4"/>
  <text x="951" y="416" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">2,650 ms</text>

  <text x="430" y="486" text-anchor="end" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">Persistable saveAll</text>
  <rect x="460" y="456" width="611" height="42" rx="10" fill="#1a5fb4"/>
  <text x="1089" y="486" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">3,426 ms</text>

  <text x="430" y="556" text-anchor="end" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">Hibernate persist (default)</text>
  <rect x="460" y="526" width="722" height="42" rx="10" fill="#6b7280"/>
  <text x="1182" y="556" text-anchor="end" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">4,048 ms</text>

  <rect x="986" y="238" width="156" height="76" rx="16" fill="#173f6d"/>
  <text x="1064" y="276" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">3.8×</text>
  <text x="1064" y="302" text-anchor="middle" fill="#cce6ff" font-family="Segoe UI, Arial, sans-serif" font-size="16">faster</text>

  <text x="72" y="604" fill="#617086" font-family="Segoe UI, Arial, sans-serif" font-size="20">Java · Hibernate · StatelessSession · Microsoft SQL Server</text>
</svg>
