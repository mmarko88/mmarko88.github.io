<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Parallel threads benchmark</title>
  <desc id="description">Splitting 100,000 SQL Server inserts across 8 parallel threads with the Bulk Copy API takes 434 milliseconds — 2.7 times faster than a single thread at 1,155 milliseconds.</desc>
  <rect width="1200" height="630" fill="#f7f9fc"/>
  <rect x="0" y="0" width="1200" height="12" fill="#1a5fb4"/>
  <text x="72" y="76" fill="#1a5fb4" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2">FAST INSERTS IN SQL SERVER · 06/08</text>
  <text x="72" y="158" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700">Parallel Bulk API 8t: 434 ms</text>
  <text x="72" y="202" fill="#4b5565" font-family="Segoe UI, Arial, sans-serif" font-size="26">100,000 inserts · batch 1,000 · 1 to 16 threads sweep</text>

  <text x="330" y="276" text-anchor="end" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">8 threads</text>
  <rect x="360" y="246" width="112" height="42" rx="10" fill="#17864b"/>
  <text x="490" y="276" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">434 ms</text>

  <text x="330" y="346" text-anchor="end" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">16 threads</text>
  <rect x="360" y="316" width="114" height="42" rx="10" fill="#17864b" opacity="0.7"/>
  <text x="492" y="346" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">442 ms</text>

  <text x="330" y="416" text-anchor="end" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">4 threads</text>
  <rect x="360" y="386" width="139" height="42" rx="10" fill="#1a5fb4"/>
  <text x="517" y="416" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">537 ms</text>

  <text x="330" y="486" text-anchor="end" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">2 threads</text>
  <rect x="360" y="456" width="258" height="42" rx="10" fill="#1a5fb4"/>
  <text x="636" y="486" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">998 ms</text>

  <text x="330" y="556" text-anchor="end" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">1 thread (baseline)</text>
  <rect x="360" y="526" width="300" height="42" rx="10" fill="#6b7280"/>
  <text x="678" y="556" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">1,155 ms</text>

  <rect x="986" y="238" width="156" height="76" rx="16" fill="#173f6d"/>
  <text x="1064" y="276" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">2.7×</text>
  <text x="1064" y="302" text-anchor="middle" fill="#cce6ff" font-family="Segoe UI, Arial, sans-serif" font-size="16">faster</text>

  <text x="72" y="604" fill="#617086" font-family="Segoe UI, Arial, sans-serif" font-size="20">Java · Parallel Bulk Copy API · 4 threads is the sweet spot · Microsoft SQL Server</text>
</svg>
