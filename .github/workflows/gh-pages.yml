name: github pages

on:
  push:
    branches:
      - master  # Set a branch to deploy
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1    # Full history not needed; front-matter dates drive .Lastmod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: '0.167.0'
          extended: true

      - name: Cache Hugo modules and generated resources
        uses: actions/cache@v4
        with:
          path: |
            /tmp/hugo_cache
            resources/_gen
          key: ${{ runner.os }}-hugocache-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-hugocache-

      - name: Run Hugo
        run: |
          hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4.1.0
        if: github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public

